[project]
name = "quantum-secret-sharing-api"
version = "0.1.0"
description = "FastAPI + Qiskit backend for Quantum Secret Sharing: N-party quantum secret sharing (GHZ / HBB)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "qiskit>=2.6.1",
    "qiskit-aer>=0.18.2",
    "cryptography>=43",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
