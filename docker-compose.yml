# docker compose up --build    →  web on :3200, API on :8000
name: quantum-secret-sharing

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    ports:
      - "3200:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
